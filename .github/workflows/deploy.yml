name: Deploy FE

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd /srv/SetupDeploy/FE_FinalProject
                      git pull

                      cd /srv/SetupDeploy
                      docker compose up -d --build FE_FinalProject

            - name: Telegram Success
              if: success()
              run: |
                  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                  -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                  -d text="✅ FE Deploy Success"

            - name: Telegram Failed
              if: failure()
              run: |
                  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                  -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                  -d text="❌ FE Deploy Failed"
